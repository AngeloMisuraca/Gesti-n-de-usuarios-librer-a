<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="auth-page">
  <main class="auth-shell">
    <section class="auth-card">
      <p class="auth-kicker">House of Books</p>
      <h1>Crea tu cuenta</h1>
      <p class="auth-subtitle">Empieza con un acceso limpio, rápido y listo para organizar tus libros.</p>

      <form id="registerForm" class="auth-form">
        <label for="username">Usuario</label>
        <input type="text" id="username" placeholder="Elige un usuario" required>

        <label for="password">Contraseña</label>
        <input type="password" id="password" placeholder="Crea una contraseña" required>

        <button type="submit">Crear cuenta</button>
      </form>

      <p id="message" class="auth-message"></p>
      <p class="auth-link">¿Ya tienes cuenta? <a href="login.html">Inicia sesión</a></p>
    </section>
  </main>
  <script src="js/register.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="auth-page">
  <main class="auth-shell">
    <section class="auth-card">
      <p class="auth-kicker">House of Books</p>
      <h1>Bienvenido de nuevo</h1>
      <p class="auth-subtitle">Accede a tu cuenta para seguir gestionando tu biblioteca.</p>

      <form id="loginForm" class="auth-form">
        <label for="username">Usuario</label>
        <input type="text" id="username" placeholder="Tu usuario" required>

        <label for="password">Contraseña</label>
        <input type="password" id="password" placeholder="Tu contraseña" required>

        <button type="submit">Entrar</button>
      </form>

      <p id="error" class="auth-message error-message"></p>
      <p class="auth-link">¿No tienes cuenta? <a href="./register.html">Regístrate</a></p>
    </section>
  </main>
  <script src="js/login.js"></script>
</body>
</html>
